[package]
name = "bai-os-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "bai-os-ui"
path = "src/main.rs"

[dependencies]
slint = "1.8"
chrono = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
